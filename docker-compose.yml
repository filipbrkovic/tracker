services:
  tracker:
    build: .
    image: localcal:local
    platform: linux/amd64
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_DIR: /data
      STATIC_DIR: /app
      TZ: Europe/Zagreb
      FOOD_SEARCH_WORKER_URL: ${FOOD_SEARCH_WORKER_URL:-}
      FOOD_SEARCH_WORKER_TOKEN: ${FOOD_SEARCH_WORKER_TOKEN:-}
    volumes:
      - ${LOCALCAL_DATA:-/DATA/AppData/localcal}:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3187}:8080"
